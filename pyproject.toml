[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "specto"
version = "0.8.0"
description = "Watch a recorded expert walkthrough of a system and write down what the system must do."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{ name = "Patricia Kusch" }]
requires-python = ">=3.11"
keywords = ["requirements-engineering", "speech-to-text", "video", "business-analysis", "ai-agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "anthropic>=1.16.0",
  "openpyxl>=3.1.5",
  "pillow>=13.0.0",
  "imageio-ffmpeg>=0.6.0",
  "pydantic>=2.14.1",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.2.1"]
whisper-precise = ["faster-whisper>=1.2.1", "stable-ts>=2.19.1"]  # word timings ~3x closer; pulls in torch (~600 MB)
ocr = ["rapidocr-onnxruntime>=1.4.4"]
live = ["mss>=10.2.0"]  # screen grabs in live mode on macOS, Windows and Linux (X11); the platform tools work without it
speakers = ["sherpa-onnx>=1.13.8"]  # --speakers: local, ungated diarization (no Hugging Face account, ~33 MB of models downloaded once)
dev = ["pytest>=9.1.1"]

[project.urls]
Homepage = "https://github.com/patkusch/specto"
Repository = "https://github.com/patkusch/specto"
Issues = "https://github.com/patkusch/specto/issues"

[project.scripts]
specto = "specto.cli:main"

[tool.setuptools.packages.find]
include = ["specto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
