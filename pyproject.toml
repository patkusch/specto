[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specto"
version = "0.3.0"
description = "Watch a recorded expert walkthrough of a system and write down what the system must do."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.5",
  "openpyxl>=3.1",
  "pillow>=10",
  "imageio-ffmpeg>=0.5",
  "pydantic>=2",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
whisper-precise = ["faster-whisper>=1.0", "stable-ts>=2.19"]  # word timings ~3x closer; pulls in torch (~600 MB)
ocr = ["rapidocr-onnxruntime>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
specto = "specto.cli:main"

[tool.setuptools.packages.find]
include = ["specto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
