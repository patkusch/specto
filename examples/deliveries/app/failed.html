<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbourline Drivers - Failed delivery</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="phone">
<div class="status"><span>09:33</span><span class="sys">5G &middot; 78%</span></div>
<div class="appbar"><div class="crumb">&lsaquo; Proof of delivery</div><h1>Failed delivery</h1><div class="sub">Stop 3 &middot; Attempt 2 of 3</div></div>
<main>
<div class="label">Reason <span class="req">*</span></div>
<div class="pick on"><span class="dot"></span>Nobody home</div><div class="pick"><span class="dot"></span>Refused by recipient</div><div class="pick"><span class="dot"></span>Address not found</div><div class="pick"><span class="dot"></span>Access blocked</div><div class="pick"><span class="dot"></span>Parcel damaged</div>
<div class="label" style="margin-top:8px">Anything else the depot should know?</div>
<div class="area">Type here</div>
<div class="btn block" style="background:var(--red);color:#1f0505">Mark as failed</div>
<div class="hint">Last attempt: 01/05/2026 &middot; Nobody home</div>
</main>
<div class="home"><span></span></div>
</div>
</body></html>
